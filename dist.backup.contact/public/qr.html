<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacifika Wear - Scan to Shop</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0F1923;
      color: #F0EDE6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 16px;
      border-radius: 24px;
      overflow: hidden;
      background: white;
      padding: 8px;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #D4A03C;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 14px;
      color: #8A94A6;
      margin-bottom: 32px;
    }
    .qr-frame {
      background: white;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .qr-frame img {
      width: 100%;
      max-width: 360px;
      border-radius: 12px;
    }
    .scan-text {
      font-size: 18px;
      font-weight: 600;
      color: #1B2A4A;
      margin-top: 16px;
    }
    .scan-sub {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    .url-bar {
      background: #1B2A4A;
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .url-bar span {
      font-family: monospace;
      font-size: 13px;
      color: #D4A03C;
    }
    .footer {
      font-size: 11px;
      color: #8A94A6;
      margin-top: 8px;
      line-height: 1.6;
    }
    .abn {
      font-size: 10px;
      color: #8A94A6;
      opacity: 0.7;
    }
    @media print {
      body {
        background: white;
        color: #1B2A4A;
      }
      .qr-frame {
        box-shadow: none;
        border: 2px solid #D4A03C;
      }
      .url-bar {
        background: #f0f0f0;
      }
      .footer, .abn {
        color: #666;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <img src="/logo.png" alt="Pacifika Wear">
    </div>

    <!-- Title -->
    <h1>Pacifika Wear</h1>
    <p class="subtitle">Authentic Pacific Island Fashion</p>

    <!-- QR Code -->
    <div class="qr-frame">
      <img src="/qr-code-large.png" alt="Scan to open Pacifika Wear">
      <p class="scan-text">Scan to Shop</p>
      <p class="scan-sub">Point your camera at the QR code</p>
    </div>

    <!-- URL -->
    <div class="url-bar">
      <span>pacifikawaer2026.fly.dev</span>
    </div>

    <!-- Footer -->
    <p class="footer">
      Island Dresses &middot; Shirts &middot; Family Sets &middot; Kids Wear<br>
      Australia-wide Shipping
    </p>
    <p class="abn">ABN: 17 121 686 746</p>
  </div>
</body>
</html>
